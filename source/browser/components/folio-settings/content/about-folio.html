<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio settings</title>
<meta http-equiv="Content-Security-Policy" content="default-src chrome:; script-src chrome:; style-src chrome:; img-src chrome: data:; object-src 'none'">
<link rel="stylesheet" href="chrome://browser/content/folio-settings/about-folio.css">

</head>
