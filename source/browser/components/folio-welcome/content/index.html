<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Folio</title>
<meta http-equiv="Content-Security-Policy" content="default-src chrome:; script-src chrome:; style-src chrome:; media-src chrome:; img-src chrome: data: blob: https: moz-icon: page-icon:; object-src 'none'">
<link rel="stylesheet" href="chrome://browser/content/folio-welcome/welcome.css">
<link rel="icon" href="chrome://branding/content/folio-mark.svg">
</head>
<body>
<video id="bg" src="folio-bg.webm" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="shade" aria-hidden="true"></div>

<!-- Stage 1: the title builds letter by letter, then the start arrow appears. -->
<section id="start">
  <h1 id="title" aria-label="Welcome to Folio. The web, collected."></h1>
  <button id="go" type="button" aria-label="Start">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</section>

<!-- Steps: same stage as the intro, no card. Title, choices, then the arrow. -->
<section id="steps" hidden>
  <div id="step-hero"></div>
  <h1 id="step-title" aria-live="polite"></h1>
  <p id="step-text"></p>
  <div id="choices"></div>
  <p id="step-note" aria-live="polite"></p>
  <div id="nav">
    <button id="back" type="button">Back</button>
    <button id="next" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div id="dots" aria-hidden="true"></div>
</section>


<script src="chrome://browser/content/folio-welcome/welcome.js"></script>
</body>
</html>
